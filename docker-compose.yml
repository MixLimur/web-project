services:
  postgres:
    image: postgres:15-alpine
    container_name: web-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: web_project_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: web-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: web-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  rest-api:
    build:
      context: ./rest-api
    container_name: web_rest
    ports:
      - "8444:8444"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/web_project_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - MINIO_URL=http://minio:9000
    depends_on:
      - postgres
      - rabbitmq
      - minio

  worker-service:
    build:
      context: ./worker-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/web_project_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - MINIO_URL=http://minio:9000
    depends_on:
      - postgres
      - rabbitmq
      - minio

  web-ui:
    build:
      context: ./web-ui
    container_name: web_ui
    ports:
      - "8443:8443"
    environment:
      - APP_REST_API_URL=https://rest-api:8444
    depends_on:
      - rest-api

  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile.autoscaler
    container_name: task-autoscaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
    depends_on:
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
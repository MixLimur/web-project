<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Система перевірки</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; margin-bottom: 10px; font-weight: bold; }
        .error { color: red; margin-bottom: 10px; font-weight: bold; }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
<h1>Завантаження документа</h1>
<p>Ви увійшли як: <strong th:text="${#authentication.name}"></strong></p>
<div th:if="${message}" class="success" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<form method="POST" th:action="@{/upload}" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <button type="submit">Перевірити на плагіат</button>
</form>

<div th:if="${taskId}"
     id="task-container"
     th:fragment="status-block"
     style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;"
     th:data-hx-get="|/status-fragment/${taskId}|"
     th:data-hx-trigger="${statusData == null or statusData.status == 'PENDING' or statusData.status == 'IN_PROGRESS' ? 'every 2s' : null}"
     hx-swap="outerHTML">

    <h3>Статус перевірки:
        <span th:if="${statusData == null}">Ініціалізація...</span>

        <span th:if="${statusData != null and (statusData.status == 'PENDING' or statusData.status == 'IN_PROGRESS')}"
              th:text="${statusData.status}"></span>

        <span th:if="${statusData != null and statusData.status == 'CANCELLED'}" style="color: red;">
            Скасовано
        </span>

        <span th:if="${statusData != null and statusData.status == 'FAILED'}" style="color: red;">
            Помилка обробки файлу
        </span>

        <span th:if="${statusData != null and statusData.status == 'DONE'}">
            Завершено
        </span>
    </h3>

    <progress id="progress-bar"
              th:value="${statusData != null and statusData.progress != null ? statusData.progress : 0}"
              max="100"
              style="width: 100%; height: 20px;">
    </progress>

    <p>Прогрес: <span th:text="${statusData != null and statusData.progress != null ? statusData.progress : 0}">0</span>%</p>

    <h2 th:if="${statusData != null and statusData.status == 'DONE'}"
        style="color: #0056b3;">
        Збіг: <span th:text="${statusData.similarityScore}"></span>%
    </h2>
</div>

<hr style="margin-top: 30px;">
<h2>Ваші завдання</h2>

<table border="1" cellpadding="10" cellspacing="0" style="width: 100%; text-align: left; border-collapse: collapse;">
    <thead>
    <tr style="background-color: #f2f2f2;">
        <th>ID Завдання</th>
        <th>Файл</th>
        <th>Статус</th>
        <th>Прогрес</th>
        <th>Результат (Збіги)</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody id="history-body"
           th:fragment="history-tbody"
           hx-get="/history-fragment"
           hx-trigger="every 2s"
           hx-swap="outerHTML">

    <tr th:each="task : ${tasks}">
        <td th:text="${#strings.substring(task.taskId, 0, 8)} + '...'">ID</td>
        <td th:text="${task.fileName}">Файл</td>
        <td>
            <strong th:text="${task.status}">Статус</strong>
        </td>
        <td th:text="${task.progress + '%'}">0%</td>
        <td th:text="${task.similarityScore != '—' ? task.similarityScore + '%' : '—'}">Результат</td>
        <td>
            <button th:if="${task.status == 'PENDING' or task.status == 'IN_PROGRESS'}"
                    th:attr="hx-post=@{/cancel/{id}(id=${task.taskId})}"
                    hx-confirm="Ви впевнені, що хочете скасувати це завдання?"
                    hx-swap="none"
                    style="color: red; padding: 4px 8px; border: 1px solid red; border-radius: 4px; background: white; cursor: pointer;">
                Скасувати
            </button>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="5" style="text-align: center;">Ви ще не завантажили жодного файлу.</td>
    </tr>
    </tbody>
</table>

</body>
</html>

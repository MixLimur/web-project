<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Система перевірки</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; margin-bottom: 10px; font-weight: bold; }
        .error { color: red; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
<h1>Завантаження документа</h1>
<p>Ви увійшли як: <strong th:text="${#authentication.name}"></strong></p>
<div th:if="${message}" class="success" th:text="${message}"></div>
<div th:if="${error}" class="error" th:text="${error}"></div>

<form method="POST" th:action="@{/upload}" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <button type="submit">Перевірити на плагіат</button>
</form>

<div th:if="${taskId}" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;" id="task-container" th:data-task-id="${taskId}">
    <h3>Статус перевірки: <span id="status-text">Ініціалізація...</span></h3>
    <progress id="progress-bar" value="0" max="100" style="width: 100%; height: 20px;"></progress>
    <p>Відсоток: <span id="progress-text">0</span>%</p>
    <h2 id="result-text" style="color: #0056b3; display: none;"></h2>
</div>

<script>
    const taskContainer = document.getElementById('task-container');

    if (taskContainer) {
        const taskId = taskContainer.getAttribute('data-task-id');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');

        function pollTaskStatus() {
            fetch('/status/' + taskId)
                .then(response => {
                    if (!response.ok) throw new Error("Помилка мережі");
                    return response.json();
                })
                .then(data => {
                    progressBar.value = data.progress || 0;
                    progressText.innerText = data.progress || 0;
                    statusText.innerText = data.status || "Невідомо";

                    if (data.status === 'DONE') {
                        resultText.style.display = 'block';
                        resultText.innerText = 'Збіг: ' + data.similarityScore + '%';
                    } else if (data.status === 'FAILED') {
                        statusText.innerText = 'Помилка обробки файлу';
                        statusText.style.color = 'red';
                    } else {
                        setTimeout(pollTaskStatus, 2000);
                    }
                })
                .catch(error => {
                    console.error('Помилка опитування:', error);
                    statusText.innerText = 'Втрачено зв\'язок із сервером';
                });
        }

        function pollHistory() {
            fetch('/history-data')
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    const tbody = document.getElementById('history-body');
                    tbody.innerHTML = ''; // Очищаємо стару таблицю

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Ви ще не завантажили жодного файлу.</td></tr>';
                        return;
                    }

                    data.forEach(task => {
                        const shortId = task.taskId.substring(0, 8) + '...';
                        const score = task.similarityScore !== '—' ? task.similarityScore + '%' : '—';

                        const row = `<tr>
                            <td>${shortId}</td>
                            <td>${task.fileName}</td>
                            <td><strong>${task.status}</strong></td>
                            <td>${task.progress}%</td>
                            <td>${score}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Помилка оновлення історії:', error));
        }
        setTimeout(pollTaskStatus, 1000);
        setInterval(pollHistory, 5000);
    }
</script>

<hr style="margin-top: 30px;">
<h2>Ваші завдання</h2>

<table border="1" cellpadding="10" cellspacing="0" style="width: 100%; text-align: left; border-collapse: collapse;">
    <thead>
    <tr style="background-color: #f2f2f2;">
        <th>ID Завдання</th>
        <th>Файл</th>
        <th>Статус</th>
        <th>Прогрес</th>
        <th>Результат (Збіги)</th>
    </tr>
    </thead>
    <tbody id="history-body">
    <tr th:each="task : ${tasks}">
        <td th:text="${#strings.substring(task.taskId, 0, 8)} + '...'">ID</td>
        <td th:text="${task.fileName}">Файл</td>
        <td>
            <strong th:text="${task.status}">Статус</strong>
        </td>
        <td th:text="${task.progress + '%'}">0%</td>
        <td th:text="${task.similarityScore != '—' ? task.similarityScore + '%' : '—'}">Результат</td>
    </tr>
    <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="5" style="text-align: center;">Ви ще не завантажили жодного файлу.</td>
    </tr>
    </tbody>
</table>

</body>
</html>

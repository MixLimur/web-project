<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - Антиплагіат</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-container">
        <h2 class="text-center" style="margin-top: 0;">Реєстрація</h2>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">Придумайте логін:</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Придумайте пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-submit">Зареєструватися</button>
        </form>

        <div class="links">
            Вже маєте акаунт? <a th:href="@{/login}">Увійти</a><br><br>
            <a th:href="@{/}">Повернутися на головну</a>
        </div>
    </div>
</div>

</body>
</html>

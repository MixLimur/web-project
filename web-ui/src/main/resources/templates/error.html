<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Помилка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-container text-center">

        <h1 class="text-danger error-title">Oops!</h1>
        <h2 class="error-subtitle">Сталася помилка</h2>

        <div class="alert alert-error" th:text="${error} ?: 'Сталася непередбачена системна помилка.'">
            Деталі помилки
        </div>

        <div class="error-links">
            <span th:text="'Статус: ' + ${status}">Статус: 500</span> |
            <span th:text="'Час: ' + ${timestamp}">Час</span>
        </div>

        <a href="/" class="btn btn-home">
            Повернутися на головну
        </a>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система перевірки робіт</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<h2>Завантаження файлу на перевірку</h2>

<form id="uploadForm">
    <div class="form-group">
        <label for="identifier">Ідентифікатор користувача:</label>
        <input type="text" id="identifier" placeholder="Напр., ПМІ-25-Max" required>
    </div>

    <div class="form-group">
        <label for="fileInput">Файл для перевірки:</label>
        <input type="file" id="fileInput" required>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="isRegistered"> Я зареєстрований користувач
        </label>
    </div>

    <button type="submit">Відправити на перевірку</button>
</form>

<div id="result"></div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerText = 'Завантаження...';

        const formData = new FormData();
        formData.append('identifier', document.getElementById('identifier').value);
        formData.append('file', document.getElementById('fileInput').files[0]);
        formData.append('isRegistered', document.getElementById('isRegistered').checked);

        try {
            const response = await fetch('/api/tasks/upload', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();

            if (response.ok) {
                resultDiv.className = 'success';
                resultDiv.innerHTML = `<strong>Успіх!</strong> Ваш файл прийнято.<br>Task ID: <code>${text}</code>`;
                document.getElementById('uploadForm').reset();
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = `Помилка: ${text}`;
            }
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.innerText = 'Помилка з\'єднання з сервером.';
        }
    });
</script>
</body>
</html>
